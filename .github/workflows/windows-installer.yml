name: Build Windows installer

on:
  push:
    branches:
      - feat/worktree-sidebar-tree
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-ci-deps
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Enable T3 Connect
        shell: bash
        run: cp .env.example .env
      - name: Build installer
        shell: bash
        env:
          T3CODE_DESKTOP_KEEP_STAGE: "true"
        run: vp run dist:desktop:win
      - name: List packaged files
        if: always()
        shell: bash
        run: find "$RUNNER_TEMP" /tmp -type d -name win-unpacked 2>/dev/null | head -1 | xargs -I{} find {} -type f | sed 's/.*win-unpacked//' | sort
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: t3code-windows-installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
